name: Publish to releases.ecash.com

# Reusable publisher: callers upload one build artifact per target and call
# this from a job on a release branch. This file's path is the signer that
# consumers verify against, so it must not move.

on:
  workflow_call:
    inputs:
      project:
        description:
          Top-level prefix in the bucket and stem of every zip name, e.g. L1-ecash-bitcoin.
        required: true
        type: string
      channel:
        description: Second path component, normally the branch (github.ref_name).
        required: true
        type: string
      artifact-pattern:
        description:
          Glob for the build artifacts. Each is named *-<target> and contains a VERSION file.
        required: true
        type: string
      targets:
        description: Newline-separated target triples; the order of files in release.json.
        required: true
        type: string
      environment:
        description: Caller's deployment environment holding the R2 secrets.
        required: false
        type: string
        default: releases
      base-url:
        description: Public URL of the bucket.
        required: false
        type: string
        default: https://releases.ecash.com
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_BUCKET:
        required: true
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}
      commit-short:
        value: ${{ jobs.publish.outputs.commit-short }}
      release-url:
        value: ${{ jobs.publish.outputs.release-url }}

permissions:
  contents: read
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish ${{ inputs.project }}/${{ inputs.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Resolved in the caller's repository; its branch policy gates the secrets.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.base-url }}/${{ inputs.project }}/${{ inputs.channel }}/latest/release.json

    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.assemble.outputs.version }}
      commit-short: ${{ steps.assemble.outputs.short }}
      release-url: ${{ steps.assemble.outputs.release-url }}

    env:
      PROJECT: ${{ inputs.project }}
      CHANNEL: ${{ inputs.channel }}
      TARGETS: ${{ inputs.targets }}
      BASE_URL: ${{ inputs.base-url }}
      COMMIT: ${{ github.sha }}
      SOURCE_REPO: ${{ github.repository }}
      # This file's own path; no context variable exposes it to a called workflow.
      SIGNER_WORKFLOW: ecash-com/releases/.github/workflows/publish.yml

    # No checkout and no third-party actions: nothing PR-influenced runs here.
    steps:
      - name: Validate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }

          is_safe_path_component() {
            case "$1" in
              *[!A-Za-z0-9._-]* | "" | .*) return 1 ;;
            esac
          }

          is_safe_path_component "$PROJECT" || die "project '$PROJECT' is not a safe path component"
          is_safe_path_component "$CHANNEL" || die "channel '$CHANNEL' is not a safe path component"
          [ -n "$(printf '%s' "$TARGETS" | tr -d '[:space:]')" ] || die "targets is empty"

          [ "$EVENT_NAME" = "push" ] || echo "::notice::Publishing from a '$EVENT_NAME' event"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: downloads

      - name: Assemble release bundles
        id: assemble
        env:
          SOURCE_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }

          export TZ=UTC # zip stores local-time DOS timestamps
          commit_short="${COMMIT:0:12}"
          mkdir -p release staging

          artifact_for_target() {
            local target="$1" matches
            matches=$(find downloads -mindepth 1 -maxdepth 1 -type d -name "*-${target}")
            [ -n "$matches" ] || die "no build artifact for target ${target}"
            [ "$(printf '%s\n' "$matches" | wc -l)" -eq 1 ] \
              || die "several artifacts match target ${target}: ${matches//$'\n'/ }"
            echo "$matches"
          }

          version_of() {
            local artifact="$1" version
            [ -f "$artifact/VERSION" ] || die "$artifact has no VERSION file"
            version=$(tr -d '[:space:]' < "$artifact/VERSION")
            case "$version" in
              *[!A-Za-z0-9._+-]* | "") die "$artifact: unusable VERSION '$version'" ;;
            esac
            echo "$version"
          }

          stage() {
            local artifact="$1" dir="staging/$2"
            mkdir -p "$dir"
            cp -a "$artifact/." "$dir/"
            rm -f "$dir/VERSION"
            # upload-artifact does not round-trip the executable bit.
            find "$dir" -type f ! -name '*.exe' -exec chmod 755 {} +
            # Fixed mtimes so a re-run zips to identical bytes.
            [ -z "$SOURCE_TIMESTAMP" ] || find "$dir" -exec touch -d "$SOURCE_TIMESTAMP" {} +
          }

          zip_deterministic() {
            local dir="$1" zip="$2"
            (cd staging && find "$dir" | LC_ALL=C sort | zip -q -X "../release/$zip" -@)
          }

          write_manifest() {
            local version="$1" files
            cd release
            sha256sum ./*.zip | sed 's| \./| |' > SHA256SUMS
            files=$(for f in *.zip; do
              jq -n --arg name "$f" \
                    --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
                    --argjson size "$(stat -c %s "$f")" \
                    '{name: $name, sha256: $sha256, size: $size}'
            done | jq -s .)
            jq -n --arg version "$version" --arg commit "$COMMIT" --arg short "$commit_short" \
                  --arg repo "$SOURCE_REPO" --arg path "${PROJECT}/${CHANNEL}/${commit_short}/" \
                  --argjson files "$files" \
                  '{version: $version, commit: $commit, commit_short: $short,
                    repository: $repo, path: $path, files: $files}' > release.json
            cd ..
          }

          version=""
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            artifact=$(artifact_for_target "$target")
            target_version=$(version_of "$artifact")
            version="${version:-$target_version}"
            [ "$version" = "$target_version" ] \
              || die "version mismatch: '$version' vs '$target_version' (${target})"
            bundle="${PROJECT}-${version}-${commit_short}-${target}"
            stage "$artifact" "$bundle"
            zip_deterministic "$bundle" "${PROJECT}-${target}.zip"
            echo "bundled ${target} -> ${PROJECT}-${target}.zip"
          done <<< "$TARGETS"

          write_manifest "$version"

          {
            echo "version=$version"
            echo "short=$commit_short"
            echo "release-url=${BASE_URL}/${PROJECT}/${CHANNEL}/${commit_short}/release.json"
          } >> "$GITHUB_OUTPUT"

          ls -l release
          cat release/SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/SHA256SUMS
            release/release.json

      - name: Collect provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/provenance.jsonl

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          # R2 lacks the flexible-checksum headers newer CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ secrets.R2_BUCKET }}
          SHORT: ${{ steps.assemble.outputs.short }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }

          immutable_prefix="${PROJECT}/${CHANNEL}/${SHORT}"
          latest_prefix="${PROJECT}/${CHANNEL}/latest"

          require_aws_cli() {
            command -v aws >/dev/null || die "aws CLI not found on runner"
            local version
            version=$(aws --version 2>&1 | sed -n 's#^aws-cli/\([0-9.]*\).*#\1#p')
            [ "$(printf '%s\n2.18.0\n' "$version" | sort -V | head -1)" = "2.18.0" ] \
              || die "aws-cli $version is too old; --if-none-match needs >= 2.18.0"
          }

          content_type() {
            case "$1" in
              *.zip)   echo "application/zip" ;;
              *.json)  echo "application/json" ;;
              *.jsonl) echo "application/x-ndjson" ;;
              *)       echo "text/plain; charset=utf-8" ;;
            esac
          }

          published_sha256() {
            aws s3api head-object --bucket "$BUCKET" --key "$1" \
              --query 'Metadata.sha256' --output text 2>/dev/null || true
          }

          # Never overwrites: identical content on re-run is a no-op, different
          # content fails. provenance.jsonl is re-signed every run, so the
          # first published bundle is kept.
          put_immutable() {
            local file="$1" key="$2" sha errors
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            errors=$(mktemp)
            if aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" \
                 --content-type "$(content_type "$file")" \
                 --cache-control 'public, max-age=31536000, immutable' \
                 --metadata "sha256=$sha,commit=$COMMIT" \
                 --if-none-match '*' >/dev/null 2>"$errors"; then
              echo "  put    $key"
              return 0
            fi
            grep -qi 'PreconditionFailed\|(412)' "$errors" || { cat "$errors" >&2; return 1; }

            local remote
            remote=$(published_sha256 "$key")
            if [ "$remote" = "$sha" ]; then
              echo "  skip   $key (already published, identical)"
            elif [ "$(basename "$file")" = "provenance.jsonl" ] && [ -n "$remote" ]; then
              echo "  skip   $key (already published; keeping the original attestation bundle)"
            else
              die "$key already exists with different content (remote sha256=$remote, local sha256=$sha)"
            fi
          }

          # Server-side copy, run last so latest/ never names a half-published release.
          move_pointer() {
            local file="$1" name
            name=$(basename "$file")
            aws s3api copy-object --bucket "$BUCKET" \
              --key "$latest_prefix/$name" \
              --copy-source "$BUCKET/$immutable_prefix/$name" \
              --metadata-directive REPLACE \
              --content-type "$(content_type "$file")" \
              --cache-control 'public, max-age=60, must-revalidate' \
              --metadata "sha256=$(published_sha256 "$immutable_prefix/$name"),commit=$COMMIT" >/dev/null
            echo "  copy   $latest_prefix/$name"
          }

          require_aws_cli

          echo "Publishing s3://$BUCKET/$immutable_prefix/"
          for file in release/*; do
            put_immutable "$file" "$immutable_prefix/$(basename "$file")"
          done

          echo "Updating s3://$BUCKET/$latest_prefix/"
          for file in release/*; do
            move_pointer "$file"
          done

      - name: Summary
        env:
          VERSION: ${{ steps.assemble.outputs.version }}
          SHORT: ${{ steps.assemble.outputs.short }}
        run: |
          set -euo pipefail
          release_url="$BASE_URL/$PROJECT/$CHANNEL/$SHORT"
          {
            echo "### Published to ${BASE_URL#https://}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT\` |"
            echo "| Channel | \`$CHANNEL\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit  | \`$COMMIT\` |"
            echo
            for f in release/*.zip; do
              echo "- [\`$(basename "$f")\`]($release_url/$(basename "$f"))"
            done
            echo
            echo "Manifest: <$release_url/release.json>, pointer: <$BASE_URL/$PROJECT/$CHANNEL/latest/release.json>"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "Verify (no GitHub login needed):"
            echo
            echo '```sh'
            echo "curl -fsSLO $release_url/provenance.jsonl"
            echo "gh attestation verify ${PROJECT}-<target>.zip --bundle provenance.jsonl \\"
            echo "  --repo $SOURCE_REPO --signer-workflow $SIGNER_WORKFLOW \\"
            echo "  --source-ref refs/heads/$CHANNEL --source-digest $COMMIT --deny-self-hosted-runners"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
